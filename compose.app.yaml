services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: my-jira-api:local
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://myjira:${POSTGRES_PASSWORD:-myjira_local_dev}@postgres:5432/myjira?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    image: my-jira-api:local
    environment: &application_environment
      API_ADDR: 0.0.0.0:8088
      DATABASE_URL: postgres://myjira:${POSTGRES_PASSWORD:-myjira_local_dev}@postgres:5432/myjira?sslmode=disable
      REDIS_ADDR: redis:6379
      APP_ORIGIN: ${DEPLOY_ORIGIN:-http://127.0.0.1:4180}
      ALLOWED_ORIGINS: ${DEPLOY_ORIGIN:-http://127.0.0.1:4180}
      API_PUBLIC_URL: ${DEPLOY_ORIGIN:-http://127.0.0.1:4180}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      LIVE_SERVICE_KEY: ${LIVE_SERVICE_KEY:-${APP_ENCRYPTION_KEY}}
      S3_ENDPOINT: minio:9000
      S3_BUCKET: ${S3_BUCKET:-myjira}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-myjira_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-myjira_local_storage}
      S3_USE_SSL: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-noreply@myjira.local}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.weblearning.fun/v1}
      AI_MODEL: gpt-5.6-terra
      MINE_API_KEY: ${MINE_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    image: my-jira-api:local
    entrypoint: ["/app/worker"]
    environment: *application_environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  live:
    build:
      context: .
      dockerfile: apps/live/Dockerfile
    image: my-jira-live:local
    environment:
      LIVE_API_URL: http://api:8088
      LIVE_SERVICE_KEY: ${LIVE_SERVICE_KEY:-${APP_ENCRYPTION_KEY}}
      ALLOWED_ORIGINS: ${DEPLOY_ORIGIN:-http://127.0.0.1:4180}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: my-jira-web:local
    ports:
      - "127.0.0.1:${APP_PORT:-4180}:80"
    depends_on:
      api: {condition: service_healthy}
      live: {condition: service_healthy}
    restart: unless-stopped
