name: my-jira
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myjira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myjira_local_dev}
      POSTGRES_DB: myjira
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myjira -d myjira"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-myjira_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-myjira_local_storage}
    ports:
      - "127.0.0.1:${S3_PORT:-29000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-29001}:9001"
    volumes:
      - object_data:/data
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${SMTP_LOCAL_PORT:-21025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-28025}:8025"
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  object_data:
